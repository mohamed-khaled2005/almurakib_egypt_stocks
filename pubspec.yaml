name: egyptian_stock_monitor
description: تطبيق مراقب الأسهم المصرية - تطبيق احترافي لمتابعة مؤشر البورصة المصرية (EGX) وأسعار الأسهم والمفضلة

publish_to: 'none'

version: 5.0.19+19

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # Firebase
  firebase_core: ^4.3.0
  firebase_analytics: ^12.1.0
  firebase_messaging: ^16.0.2

  # Notifications
  flutter_local_notifications: ^17.2.4

  # State Management
  provider: ^6.1.1

  # Networking
  http: ^1.1.2

  # Local Storage
  shared_preferences: ^2.2.2

  # UI & Utils
  flutter_svg: ^2.0.0
  fl_chart: ^0.68.0
  url_launcher: ^6.2.3
  intl: ^0.20.2
  cupertino_icons: ^1.0.6
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^7.0.1
  dlibphonenumber: ^1.1.60
  font_awesome_flutter: ^11.0.0
  web_socket_channel: ^3.0.3
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1
  change_app_package_name: ^1.1.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/Icon.png
    - assets/images/logo.png

  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
        - asset: assets/fonts/Tajawal-ExtraBold.ttf
          weight: 900

# ✅ Launcher Icon (بدون Adaptive Icons)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/Icon.png"
  image_path_ios: "assets/images/icon_ios.png"
  min_sdk_android: 21
  remove_alpha_ios: true
